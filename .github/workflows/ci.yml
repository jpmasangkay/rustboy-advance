name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl-dev \
            libgl1-mesa-dev \
            libegl-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check no_std core builds
        run: |
          cargo check -p gba-core --no-default-features
          cargo check -p gb-core --no-default-features
          cargo check -p gba-debugger --no-default-features

      - name: Check fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: Check web frontend JavaScript syntax
        run: |
          node --check web/server.js
          node --check web/storage.js
          node --check web/input.js
          node --check web/audio-worklet.js
          node --check web/main.js

      - name: Run workspace unit & harness tests
        run: |
          cargo test --workspace
          cargo test -p gba-core --features jit

      - name: Build release libretro core & desktop binary
        run: |
          cargo build --release -p gba-libretro
          cargo build --release -p gba-testrunner

      - name: Fetch freely-redistributable test ROMs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/fetch-test-roms.sh

      - name: Fetch freely-redistributable test ROMs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-test-roms.ps1

      - name: Run GBA test ROM suite & generate TEST_RESULTS.md
        run: cargo run --release -p gba-testrunner -- --report TEST_RESULTS.md --fail-on-unexpected

      - name: Upload TEST_RESULTS.md and test_output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TEST_RESULTS.md
            test_output/
          if-no-files-found: warn
