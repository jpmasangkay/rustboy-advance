name: Deploy WebAssembly Frontend

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/gba-core/**"
      - "crates/gba-frontend-web/**"
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/gba-core/**"
      - "crates/gba-frontend-web/**"
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Run web frontend unit tests and clippy
        run: |
          cargo test -p gba-frontend-web
          cargo clippy --no-deps -p gba-frontend-web --all-targets -- -D warnings
          cargo clippy --no-deps --target wasm32-unknown-unknown -p gba-frontend-web -- -D warnings

      - name: Install matching wasm-bindgen-cli
        run: |
          WBG_VER=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          echo "Resolved wasm-bindgen version: $WBG_VER"
          if ! command -v wasm-bindgen >/dev/null || [ "$(wasm-bindgen --version | awk '{print $2}')" != "$WBG_VER" ]; then
            cargo install wasm-bindgen-cli --version "$WBG_VER" --locked --force
          fi

      - name: Build WASM release binary and generate JS bindings
        run: |
          cargo build --target wasm32-unknown-unknown --release -p gba-frontend-web
          wasm-bindgen --target web --out-dir web/pkg target/wasm32-unknown-unknown/release/gba_frontend_web.wasm
          ls -lh web/pkg

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
