[package]
name = "gba-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitflags.workspace = true
serde.workspace = true
postcard.workspace = true
log.workspace = true
lz4_flex.workspace = true
cranelift-jit = { version = "0.138.0-rc.1", optional = true }
cranelift-module = { version = "0.138.0-rc.1", optional = true }
cranelift-frontend = { version = "0.138.0-rc.1", optional = true }
cranelift-codegen = { version = "0.138.0-rc.1", optional = true }
cranelift-native = { version = "0.138.0-rc.1", optional = true }

[features]
default = ["std"]
std = []
jit = [
    "std",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-frontend",
    "dep:cranelift-codegen",
    "dep:cranelift-native",
]

