[package]
name = "gba-frontend-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rustboy-advance"
path = "src/main.rs"

[dependencies]
gba-core = { path = "../gba-core" }
gb-core = { path = "../gb-core" }
gba-debugger = { path = "../gba-debugger", features = ["std"] }
log.workspace = true
serde.workspace = true
serde_json = "1.0"
egui = "0.31"
egui_glow = { version = "0.31", features = ["winit"] }
egui-winit = { version = "0.31", default-features = false, features = ["clipboard", "wayland", "x11"] }
glow = "0.16"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
rfd = "0.15"
cpal = "0.15"
ringbuf = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gif = "0.13"
lz4_flex = "0.14"
crc32fast = "1.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["util"] }
piccolo = "0.3"
md-5 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(windows)'.dependencies]
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }

[target.'cfg(not(windows))'.dependencies]
gilrs = "0.11"
